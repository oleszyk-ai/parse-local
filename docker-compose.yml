version: "3.8"

services:
  parse-local:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Persist model downloads between container restarts
      - ./models:/app/models
    environment:
      - N_GPU_LAYERS=0  # Set to -1 if you have NVIDIA GPU + nvidia-docker
      - N_CTX=8192
      - TEMPERATURE=0.1
    restart: unless-stopped